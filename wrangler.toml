name = "ai-workbench"
main = "src/worker/index.ts"
compatibility_date = "2024-11-27"

# D1 数据库配置
[[d1_databases]]
binding = "DB"
database_name = "ai_workbench_db"
database_id = "your-db-id"

# R2 存储配置
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "ai-workbench-avatars"

# 环境变量
[env.production]
vars = { ENVIRONMENT = "production" }

[env.development]
vars = { ENVIRONMENT = "development" }
